spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sirene}
spring.datasource.username=${DB_USER:sirene}
spring.datasource.password=${DB_PASSWORD:sirene}

# Le schéma est créé par le script SQL fourni, Hibernate ne fait que le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erreurs au format RFC 7807 (application/problem+json)
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# OAuth2 : l'API vérifie elle-même les JWT, sans appeler Keycloak à chaque requête.
# jwk-set-uri : où télécharger les clés PUBLIQUES de Keycloak (adresse interne au réseau Docker)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8180/realms/sirene/protocol/openid-connect/certs}
# issuer-uri : valeur attendue dans le champ "iss" du jeton (adresse publique de Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI:http://localhost:8180/realms/sirene}
