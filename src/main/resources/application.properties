spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sirene}
spring.datasource.username=${DB_USER:sirene}
spring.datasource.password=${DB_PASSWORD:sirene}

# Le schéma est créé par le script SQL fourni, Hibernate ne fait que le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erreurs au format RFC 7807 (application/problem+json)
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
